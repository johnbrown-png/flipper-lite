# Fly.io app config for the analytics webhook receiver only.
# Run all fly commands from inside this analytics/ folder (it is the build context):
#   cd analytics
#   fly deploy
# First-time setup: fly launch --no-deploy; fly volumes create analytics_data --size 1;
#                   fly secrets set ANALYTICS_TOKEN=your_shared_token
app = "flipper-analytics-collector"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "analytics_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
