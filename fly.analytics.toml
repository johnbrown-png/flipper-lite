# Fly.io app config for the analytics webhook receiver only.
# Deploy with: fly launch --config fly.analytics.toml --dockerfile Dockerfile.analytics
# (then: fly volumes create analytics_data --size 1
#        fly secrets set ANALYTICS_TOKEN=your_shared_token
#        fly deploy --config fly.analytics.toml)
#
# Rename `app` below to a globally-unique name before first deploy.
app = "flipper-analytics-collector"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.analytics"

[mounts]
  source = "analytics_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
